server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  # API: proxy interno al contenedor backend (no expuesto públicamente)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # El service worker y el manifest no deben cachearse para que las actualizaciones lleguen
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri /index.html; }
}
